---
- project:
    name: openstack-k8s-operators/sg-core
    github-check:
      jobs:
        - telemetry-container-image-content-provider:
            override-checkout: master
            vars:
              container_images:
                - src: "{{ ansible_user_dir }}/src/github.com/openstack-k8s-operators/sg-core"
                  name: sg-core
                  update_var: cifmw_update_containers_ceilometersgcoreImage
            irrelevant-files: &irrelevant-files
              - .github/.*
              - ci/.*
              - devstack/.*
              - docs/.*
              - generator/.*
              - test-bench/.*
              - OWNERS
              - OWNERS_ALIASES
              - LICENSE
              - config.yaml
              - .gitignore
              - .golangci.yaml
        - functional-tests-osp19:
            required-projects:
              - name: infrawatch/feature-verification-tests
                override-checkout: master
            vars:
              # Override content_provider_registry_ip because there is no
              # openstack-operator content provider job, which would set
              # this value. Use the telemetry content provider instead.
              content_provider_registry_ip: "{{ telemetry_content_provider_registry_ip | default('') }}"
            irrelevant-files: *irrelevant-files
        - feature-verification-tests-noop:
            files: *irrelevant-files
